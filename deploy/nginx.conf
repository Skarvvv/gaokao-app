# ============================================
# Nginx 配置 — 高考志愿填报 App 反向代理
# ============================================
# 放置路径: deploy/nginx.conf
# 功能: HTTPS + 反向代理 + 静态文件缓存 + 安全头
# ============================================

# ── 限流 (防止高考出分期流量洪峰冲垮服务) ──
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=50r/s;

# ── HTTP → HTTPS 重定向 ──
server {
    listen 80;
    server_name _;  # 替换为你的域名，如 zhiyuan.example.com

    # 健康检查不重定向（方便运维直接 HTTP 检测）
    location /api/health {
        proxy_pass http://app:8000;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主配置 ──
server {
    listen 443 ssl;
    server_name _;  # 替换为你的域名

    # ── SSL 证书 ──
    # 方案一: Let's Encrypt 免费 (推荐)
    #   用 certbot 自动获取和续期: certbot --nginx -d your-domain.com
    # 方案二: 腾讯云 SSL 证书服务 (国内服务器推荐)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ── SSL 安全配置 ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── 安全头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS (启用后浏览器强制 HTTPS，需确保证书始终有效)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── 请求体大小限制 ──
    client_max_body_size 10m;

    # ── API 反向代理 ──
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 调用可能耗时较长，设置超时
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # CORS (已在 FastAPI 中配置，Nginx 层不重复添加)
    }

    # ── 前端静态文件 ──
    # 由 FastAPI StaticFiles 处理，Nginx 直接透传
    location / {
        limit_req zone=global_limit burst=100 nodelay;

        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 日志 ──
    access_log /var/log/nginx/gaokao_access.log;
    error_log  /var/log/nginx/gaokao_error.log;
}
